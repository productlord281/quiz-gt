<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Graph Theory Quiz</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{min-height:100%;background:#fff}
body{font-family:Arial,Helvetica,sans-serif;color:#0a0a0a;-webkit-tap-highlight-color:transparent}
#app{min-height:100vh;min-height:100dvh;max-width:480px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
.bar{height:6px;background:#eee;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:#0a0a0a}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:24px;padding:12px 0}
.q{font-size:28px;line-height:1.2;font-weight:800}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:60px;padding:12px 16px;border:3px solid #0a0a0a;border-radius:16px;background:#fff;color:#0a0a0a;font:700 20px Arial,sans-serif;text-align:left}
.opt b{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#0a0a0a;color:#fff;font-size:17px}
.opt.sel{background:#0a0a0a;color:#fff}.opt.sel b{background:#fff;color:#0a0a0a}
.opt.ok{background:#1faa59;border-color:#1faa59;color:#fff}.opt.ok b{background:#fff;color:#1faa59}
.opt.bad{background:#e5392f;border-color:#e5392f;color:#fff}.opt.bad b{background:#fff;color:#e5392f}
.opt.dim{opacity:.3}
.lock .opt{pointer-events:none}
input{width:100%;padding:16px;border:3px solid #0a0a0a;border-radius:16px;background:#fff;font:700 22px Arial,sans-serif;color:#0a0a0a}
.btn{width:100%;padding:18px;border:0;border-radius:16px;background:#0a0a0a;color:#fff;font:800 20px Arial,sans-serif;letter-spacing:.06em}
img{display:block;max-width:100%;max-height:62vh;margin:0 auto;border-radius:6px}
.word{font-size:42px;line-height:1;font-weight:800}
.pts{font-size:56px;line-height:1;font-weight:800}
.sm{font-size:18px;font-weight:700;color:#555}
.warn{font-size:15px;font-weight:700;color:#e5392f}
.lb{display:flex;justify-content:space-between;font-size:22px;font-weight:700;padding:8px 0;border-bottom:2px solid #0a0a0a}
.link{align-self:center;background:none;border:0;padding:12px;font:700 13px Arial,sans-serif;letter-spacing:.1em;text-decoration:underline;color:#888}
</style>
</head>

const DM = () => JSON.parse(ls.get('gtq-demo') || '{"p":{},"a":{},"sc":{}}');
function demo(a, b) {
  const m = DM(), o = {ok: true};
  switch (a) {
    case 'poll': o.s = m.s || null; o.np = Object.keys(m.p).length; o.na = Object.keys(m.a[b.i] || {}).length; break;
    case 'join': m.p[b.id] = b.name; break;
    case 'ans': (m.a[b.i] = m.a[b.i] || {})[b.id] = b.k; break;
    case 'state': m.s = {i: b.i, phase: b.phase, n: Date.now()}; if (b.phase === 'open') delete m.a[b.i]; break;
    case 'score': m.sc[b.id] = {n: b.name, s: b.score}; break;
    case 'board': o.b = Object.values(m.sc).sort((x, y) => y.s - x.s).slice(0, 5); break;
    case 'reset': ls.del('gtq-demo'); return o;
  }
  ls.set('gtq-demo', JSON.stringify(m));
  return o;
}
async function call(a, b) {
  b = Object.assign({a}, b || {});
  if (me && me.admin) b.adm = ADMIN;
  if (mode !== 'srv') return demo(a, b);
  const r = await fetch('/api/quiz', {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify(b)});
  const j = await r.json();
  if (!j.ok && a === 'poll') throw new Error('api');
  return j;
}
const st = (i, phase) => { S = {i, phase, n: Date.now()}; L.rv = null; draw(); return call('state', {i, phase, n: S.n}).catch(() => { P.err = 1; }); };

// ---- what the admin button does ----
function nb() {
  const s = S;
  if (s.phase === 'lobby') return ['START Q1', () => st(0, 'open')];
  if (s.phase === 'open') return ['REVEAL NOW', () => st(s.i, 'reveal')];
  if (s.phase === 'reveal') return s.i % 2 ? ['END ROUND', () => st(s.i, 'break')] : ['NEXT QUESTION', () => st(s.i + 1, 'open')];
  if (s.phase === 'break') return s.i === N - 1 ? ['SHOW RESULTS', () => st(s.i, 'done')] : ['START Q' + (s.i + 2), () => st(s.i + 1, 'open')];
  return ['RESET QUIZ', () => call('reset').then(() => { S = {i: -1, phase: 'lobby', n: 0}; BD = []; draw(); })];
}

// ---- screens (white, nothing but what is needed) ----
const paint = h => { app.className = ''; app.innerHTML = h; };
const opts = (q, f) => `<div class="opts">${q[1].map((t, k) => f(k, t)).join('')}</div>`;
function view() {
  if (!me) return paint(`<div class="mid"><img src="${IMG.stick}" alt=""><input id="nm" maxlength="16" placeholder="Your name" autocomplete="off"><button class="btn" id="join">JOIN</button></div>`);
  if (S.n !== L.n) { L.n = S.n; L.t0 = Date.now(); }
  const ad = me.admin, q = QS[S.i], mine = (me.a || {})[S.i];
  const ctl = ad ? `<button class="btn" id="act">${nb()[0]}</button>` : '';
  const note = ad ? (mode !== 'srv' ? '<p class="warn">Database not connected yet. In Vercel: Storage, create a Redis database, connect it to this project, then redeploy.</p>' : P.err ? '<p class="warn">Can’t reach the server. Check your internet.</p>' : '') : '';
  const rst = ad && S.phase === 'lobby' ? `<button class="link" id="rst">RESET ALL</button>` : '';
  if (S.phase === 'lobby') return paint(`<div class="mid"><div class="q">${ad ? P.np + ' joined' : 'You’re in, ' + esc(me.name) + '.'}</div><p class="sm">${ad ? 'Start when everyone is in.' : 'Waiting for the host.'}</p>${note}${ctl}</div>${rst}`);
  if (S.phase === 'break') return paint(`<div class="mid"><img src="${IMG['m' + (Math.floor(S.i / 2) + 1)]}" alt="">${ctl}</div>`);
  if (S.phase === 'open') return paint(`<div class="bar"><i id="bar"></i></div><div class="mid"><div class="q">${q[0]}</div>` +
    (ad ? `<p class="sm">${P.na} of ${P.np} answered</p>${ctl}` : opts(q, (k, t) => `<button class="opt${mine && mine.k === k ? ' sel' : ''}" data-k="${k}"><b>${'ABC'[k]}</b>${t}</button>`)) + `</div>`);
  if (S.phase === 'reveal') {
    const ok = mine && mine.k === q[2];
    const head = ad ? '' : `<div><div class="word">${ok ? 'CORRECT' : 'NEXT TIME'}</div>${ok ? `<div class="pts">+${mine.p}</div>` : ''}<div class="sm">${me.tot || 0} points</div></div>`;
    return paint(`<div class="mid">${head}` + opts(q, (k, t) => `<div class="opt ${k === q[2] ? 'ok' : (mine && mine.k === k ? 'bad' : 'dim')}"><b>${'ABC'[k]}</b>${t}</div>`) + `${ctl}</div>`);
  }
  const rows = BD.map(r => `<div class="lb"><span>${esc(r.n)}</span><span>${r.s}</span></div>`).join('');
  paint(`<div class="mid">${ad ? '' : `<div><div class="sm">YOUR SCORE</div><div class="pts">${me.tot || 0}</div></div>`}<div>${rows}</div>${ctl}</div>`);
}
function draw() {
  if (me && !me.admin && S.phase === 'reveal') {            // add this question's points once
    me.d = me.d || {};
    if (!me.d[S.i]) { me.d[S.i] = 1; me.tot = (me.tot || 0) + (((me.a || {})[S.i] || {}).p || 0); save(); call('score', {id: me.id, name: me.name, score: me.tot}).catch(() => {}); }
  }
  const key = JSON.stringify([!!me, me && me.admin, S, me && me.a && me.a[S.i], me && me.tot, P.np, P.na, P.err, BD]);
  if (key !== lastKey) { lastKey = key; view(); }
}
async function tick() {
  try { const r = await call('poll', {i: S.i}); S = r.s || {i: -1, phase: 'lobby', n: 0}; P = {np: r.np || 0, na: r.na || 0};
    if (me && !me.admin) { const g = S.g || '0'; if (me.g === undefined) { me.g = g; save(); } else if (me.g !== g) { me.g = g; me.tot = 0; me.a = {}; me.d = {}; save(); call('join', {id: me.id, name: me.name}).catch(() => {}); } } }
  catch (e) { P.err = 1; }
  if (S.phase === 'done' && Date.now() - L.bt > 3000) { L.bt = Date.now(); try { BD = (await call('board')).b || []; } catch (e) {} }
  if (me && !me.admin && S.phase === 'lobby' && Date.now() - L.jt > 5000) { L.jt = Date.now(); call('join', {id: me.id, name: me.name}).catch(() => {}); }
  draw(); setTimeout(tick, me && me.admin ? 800 : 1000);
}

// ---- timer bar, auto reveal (admin), taps ----
setInterval(() => {
  if (S.phase !== 'open') return;
  const el = (Date.now() - L.t0) / 1000, bar = document.getElementById('bar');
  if (bar) bar.style.width = Math.max(0, 100 - el / SECS * 100) + '%';
  if (el >= SECS) app.classList.add('lock');
  if (me && me.admin && el >= SECS + 1 && L.rv !== S.n) { L.rv = S.n; st(S.i, 'reveal'); }
}, 200);

app.addEventListener('click', e => {
  const t = e.target, o = t.closest('.opt');
  if (t.id === 'join') {
    const name = document.getElementById('nm').value.trim(); if (!name) return;
    me = {name, admin: name.toLowerCase() === ADMIN, id: Math.random().toString(36).slice(2, 10), tot: 0, a: {}, d: {}, g: S.g || '0'};
    save(); if (!me.admin) call('join', {id: me.id, name}).catch(() => {});
    lastKey = ''; draw();
  } else if (t.id === 'act') nb()[1]();
  else if (t.id === 'rst') { if (confirm('Reset the whole quiz?')) { call('reset'); S = {i: -1, phase: 'lobby', n: 0}; BD = []; lastKey = ''; draw(); } }
  else if (o && me && !me.admin && S.phase === 'open' && !((me.a || {})[S.i])) {
    const el = (Date.now() - L.t0) / 1000; if (el >= SECS) return;
    const k = +o.dataset.k, q = QS[S.i];
    me.a = me.a || {}; me.a[S.i] = {k, p: k === q[2] ? PTS[el < 5 ? 0 : el < 10 ? 1 : 2] : 0}; save();
    call('ans', {i: S.i, id: me.id, k}).catch(() => {}); lastKey = ''; draw();
  }
});
draw();
fetch('/api/quiz', {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({a: 'ping'})})
  .then(r => r.json()).then(j => { mode = j && j.ok ? 'srv' : 'demo'; }).catch(() => { mode = 'demo'; }).then(() => { lastKey = ''; tick(); });
</script>
</body>
</html>
